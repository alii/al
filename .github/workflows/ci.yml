name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The GC stress gate: SCARLET_GC_STRESS=1 makes every allocation safepoint
      # collect, so a value held in a Rust local across an allocation — a
      # rooting-rule violation — fails deterministically instead of
      # corrupting memory intermittently.
      - name: Test (GC stress)
        run: SCARLET_GC_STRESS=1 cargo test --workspace

  grammar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/tree-sitter-scarlet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install

      # src/ is committed because grammar consumers build from it; editing
      # grammar.js without regenerating must fail here. lexical.js is read by
      # this step but never written by it, so a stale copy regenerates a
      # matching src/ and this diff stays clean. It comes from
      # crates/scarlet_syntax and is gated in the `test` job by xtask's
      # generated_files_are_up_to_date — `cargo xtask gen-editor-syntax --check`.
      - name: Generated parser is current
        run: bun run generate && git diff --exit-code src grammar.js

      # The grammar-vs-parser sync check: every .scrl the compiler's own
      # corpus accepts must parse without an error node.
      - name: Corpus
        run: bun run corpus

  # Dead-code gate: hawk treats the workspace as a closed world and fails on
  # `pub` items nothing reachable from the `scarlet` binary uses. It links
  # against rustc internals, so this pinned release must match the Rust
  # version in rust-toolchain.toml — bump them together.
  hawk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install hawk
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/astral-sh/hawk/releases/download/0.1.12/cargo-hawk-installer.sh | sh

      - name: Hawk
        run: cargo hawk check -D warnings

  # Type-hardening gate: mordant's lints fire only on provable claims, and
  # mordant-baseline.toml accepts the findings that predate the gate, so this
  # fails only on new ones. To accept a finding deliberately, regenerate with
  # MORDANT_BASELINE_WRITE=1 and commit the baseline. The lints build against
  # their own pinned nightly, which dylint fetches; the workspace toolchain is
  # untouched.
  mordant:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Cache dylint drivers
        uses: actions/cache@v4
        with:
          path: ~/.dylint_drivers
          key: dylint-drivers-${{ runner.os }}

      - name: Install dylint
        run: cargo install cargo-dylint dylint-link --locked

      - name: Mordant
        run: cargo dylint --all
        env:
          DYLINT_RUSTFLAGS: -D warnings
