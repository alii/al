name: CI

on:
  push:
    branches-ignore:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The GC stress gate: SCARLET_GC_STRESS=1 makes every allocation safepoint
      # collect, so a value held in a Rust local across an allocation — a
      # rooting-rule violation — fails deterministically instead of
      # corrupting memory intermittently.
      - name: Test (GC stress)
        run: SCARLET_GC_STRESS=1 cargo test --workspace

  grammar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/tree-sitter-scarlet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install

      # src/ is committed because grammar consumers build from it; editing
      # grammar.js without regenerating must fail here.
      - name: Generated parser is current
        run: bun run generate && git diff --exit-code src grammar.js

      # The grammar-vs-parser sync check: every .scrl the compiler's own
      # corpus accepts must parse without an error node.
      - name: Corpus
        run: bun run corpus
