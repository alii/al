[package]
name = "scrl"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
# Interpreter dispatch instrumentation — forwarded to `scrl_vm`, where the
# dispatch loop lives. See its manifest.
op-histogram = ["scrl_vm/op-histogram"]

[dependencies]
scrl_core = { path = "../scrl_core" }
scrl_vm = { path = "../scrl_vm" }
clap = { version = "4", features = ["derive"] }
clap_mangen = "0.3"
percent-encoding = "2"
rustyline = "14"
serde_json = "1"
ureq = "2"

[build-dependencies]
scrl_core = { path = "../scrl_core" }

[dev-dependencies]
scrl_core = { path = "../scrl_core" }
scrl_vm = { path = "../scrl_vm", features = ["alloc-counter"] }
cranelift-codegen = { workspace = true }
cranelift-frontend = { workspace = true }
cranelift-jit = { workspace = true }
cranelift-module = { workspace = true }
cranelift-native = { workspace = true }
serde_json = "1"

[[bin]]
name = "scrl"
path = "src/main.rs"

