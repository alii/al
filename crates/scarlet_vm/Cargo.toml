[package]
name = "scarlet_vm"
version = "0.1.0"
edition = "2024"

[features]
# Instruments `ProcHeap::alloc_object` with a per-thread counter so tests can
# assert net allocations (Perceus reuse). Enabled only from `scarlet`'s
# [dev-dependencies]; with `resolver = "2"` that keeps it out of `cargo build`,
# so the release binary carries no counter.
#
# It has to be a feature rather than `cfg(test)`: the tests that read it are
# `scarlet`'s integration tests, where `scarlet_vm` is a plain dependency and its
# `cfg(test)` is false.
alloc-counter = []

# Interpreter dispatch instrumentation: per-opcode and per-function op
# histograms dumped to stderr once a run passes SCRL_OP_HISTOGRAM_OPS ops.
# Off by default — a normal run must not write to stderr.
op-histogram = []

[dependencies]
indexmap = { workspace = true }
cranelift-codegen = { workspace = true }
cranelift-frontend = { workspace = true }
cranelift-module = { workspace = true }
cranelift-jit = { workspace = true }
cranelift-native = { workspace = true }
libc = "0.2"
# OS CSPRNG for `Op::RandomBytes`. getrandom(2) on Linux, getentropy on
# macOS — not a userspace generator and not rustls's RNG.
getrandom = "0.4"
memchr = "2"
mio = { version = "1", features = ["os-poll", "os-ext"] }
smallvec = "1.15"
socket2 = { version = "0.5", features = ["all"] }
libmimalloc-sys = { version = "0.1.49", features = ["v2"] }
simd-json = { version = "0.17.3", default-features = false, features = ["runtime-detection"] }
# TLS. rustls is sans-IO: it never owns the socket and never blocks, so it
# drops into this crate's existing non-blocking poller without a thread of its
# own and without a second event loop. See `vm/tls.rs` for the full argument.
rustls = { version = "0.23", features = ["aws-lc-rs"] }
rustls-pki-types = "1"
# Trust roots: the machine's own store first, this bundle as the fallback.
rustls-native-certs = "0.8"
webpki-roots = "1"

[dev-dependencies]
# A throwaway CA and leaf, so `vm::tls`'s own tests can establish a real session
# against a real peer without touching the machine's trust store or the network.
# The write path's flush step is only observable over an ESTABLISHED session:
# before the handshake rustls buffers plaintext instead of encoding records, so
# there is no ciphertext for a full socket to refuse and nothing to flush.
rcgen = "0.13"
